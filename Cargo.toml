[workspace]
resolver = "2"
members = [
    "crates/rgba-core",
    "crates/rgba-arm",
    "crates/rgba-ppu",
    "crates/rgba-apu",
    "crates/rgba-frontend",
    "crates/rgba-wasm",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MPL-2.0"
authors = ["rgba contributors"]
description = "GBA emulator in Rust — port inspired by mGBA"

[workspace.dependencies]
rgba-core = { path = "crates/rgba-core" }
rgba-arm = { path = "crates/rgba-arm" }
rgba-ppu = { path = "crates/rgba-ppu" }
rgba-apu = { path = "crates/rgba-apu" }
serde = { version = "1", features = ["derive"] }
bitflags = "2"
log = "0.4"
